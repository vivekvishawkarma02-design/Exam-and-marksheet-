name: Deploy Firebase

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "rules-only"
        type: choice
        options:
          - rules-only
          - rules-and-functions

permissions:
  contents: read

jobs:
  deploy-firebase:
    name: Build, Test & Deploy Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate required GitHub configuration
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PROJECT_ID_SECRET: ${{ secrets.FIREBASE_PROJECT_ID }}
          PROJECT_ID_VAR: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          PROJECT_ID="${PROJECT_ID_SECRET:-$PROJECT_ID_VAR}"
          if [ -z "$SA_JSON" ]; then
            echo "::error::Missing GitHub Secret FIREBASE_SERVICE_ACCOUNT_JSON. Add your Firebase service account JSON in GitHub Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Missing FIREBASE_PROJECT_ID. Add your Firebase Project ID as a GitHub Secret or Variable named FIREBASE_PROJECT_ID."
            exit 1
          fi
          echo "Configuration check passed (secrets verified without printing values)."

      - name: Install, build, and test Cloud Functions
        if: ${{ (inputs.target || 'rules-only') == 'rules-and-functions' }}
        working-directory: functions
        run: |
          npm install
          npm run build
          npm test

      - name: Check Firestore Rules compiled size (<= 230,000 bytes)
        run: |
          npx --yes firebase-tools@latest setup:emulators:firestore
          node scripts/check-firestore-rules-size.mjs firestore.rules 230000

      - name: Deploy Firestore Rules and Indexes (named database)
        if: ${{ (inputs.target || 'rules-only') == 'rules-only' }}
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PROJECT_ID_SECRET: ${{ secrets.FIREBASE_PROJECT_ID }}
          PROJECT_ID_VAR: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          PROJECT_ID="${PROJECT_ID_SECRET:-$PROJECT_ID_VAR}"
          CRED_FILE="$RUNNER_TEMP/firebase-service-account.json"
          LOG_FILE="$RUNNER_TEMP/firebase-indexes-deploy.log"
          SUMMARY_FILE="$RUNNER_TEMP/rules-release-summary.txt"
          printf '%s' "$SA_JSON" > "$CRED_FILE"
          chmod 600 "$CRED_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$CRED_FILE"

          WAITS=(20 40 60 90 120)
          MAX_ATTEMPTS=6
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Attempt $attempt of $MAX_ATTEMPTS: deploying Firestore indexes..."
            set +e
            npx --yes firebase-tools@latest deploy \
              --only firestore:indexes \
              --project "$PROJECT_ID" \
              --force > "$LOG_FILE" 2>&1
            STATUS=$?
            set -e
            cat "$LOG_FILE"

            if [ "$STATUS" -eq 0 ]; then
              rm -f "$LOG_FILE"
              echo "Indexes deploy succeeded on attempt $attempt of $MAX_ATTEMPTS."
              break
            fi

            if grep -Eiq 'HTTP Error: (400|403|409)|\b(400|403|409)\b' "$LOG_FILE"; then
              rm -f "$LOG_FILE"
              echo "::error::Non-retryable error during indexes deploy (exit code $STATUS). Failing immediately."
              exit "$STATUS"
            elif grep -Eiq '503|unavailable|ETIMEDOUT|ECONNRESET' "$LOG_FILE"; then
              rm -f "$LOG_FILE"
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                WAIT_SEC="${WAITS[$((attempt - 1))]}"
                echo "Transient error detected (503/unavailable/ETIMEDOUT/ECONNRESET). Waiting ${WAIT_SEC}s before retry..."
                sleep "$WAIT_SEC"
              else
                echo "::error::Indexes deploy failed after $MAX_ATTEMPTS attempts (exit code $STATUS)."
                exit "$STATUS"
              fi
            else
              rm -f "$LOG_FILE"
              echo "::error::Non-retryable error during indexes deploy (exit code $STATUS). Failing immediately."
              exit "$STATUS"
            fi
          done

          node scripts/release-firestore-rules.mjs \
            --project "$PROJECT_ID" \
            --summary-out "$SUMMARY_FILE"

      - name: Deploy Firestore Rules, Indexes, and Cloud Functions
        if: ${{ (inputs.target || 'rules-only') == 'rules-and-functions' }}
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PROJECT_ID_SECRET: ${{ secrets.FIREBASE_PROJECT_ID }}
          PROJECT_ID_VAR: ${{ vars.FIREBASE_PROJECT_ID }}
          PLAY_SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          PROJECT_ID="${PROJECT_ID_SECRET:-$PROJECT_ID_VAR}"
          CRED_FILE="$RUNNER_TEMP/firebase-service-account.json"
          SUMMARY_FILE="$RUNNER_TEMP/rules-release-summary.txt"
          printf '%s' "$SA_JSON" > "$CRED_FILE"
          chmod 600 "$CRED_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$CRED_FILE"

          if [ -n "$PLAY_SA_JSON" ]; then
            echo "Optional PLAY_SERVICE_ACCOUNT_JSON detected; syncing to functions/.env for deployment without printing values."
            python3 - <<'PY'
          import os, json
          raw = os.environ["PLAY_SA_JSON"].strip()
          # Validate JSON without printing contents
          json.loads(raw)
          with open("functions/.env", "w", encoding="utf-8") as f:
              f.write("PLAY_SERVICE_ACCOUNT_JSON=" + json.dumps(raw) + "\n")
          PY
            chmod 600 functions/.env
          fi

          npx --yes firebase-tools@latest deploy \
            --project "$PROJECT_ID" \
            --only firestore:rules,firestore:indexes,functions \
            --force

          node scripts/release-firestore-rules.mjs \
            --project "$PROJECT_ID" \
            --readback-only \
            --summary-out "$SUMMARY_FILE"

      - name: Clean up temporary credential files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/firebase-service-account.json" functions/.env

      - name: Confirm released rules database
        if: success()
        run: |
          SUMMARY_FILE="$RUNNER_TEMP/rules-release-summary.txt"
          if [ ! -s "$SUMMARY_FILE" ]; then
            echo "::error::Missing real rules readback summary ($SUMMARY_FILE)."
            exit 1
          fi
          cat "$SUMMARY_FILE"
          rm -f "$SUMMARY_FILE"

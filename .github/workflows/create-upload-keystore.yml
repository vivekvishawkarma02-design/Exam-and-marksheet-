name: Create Upload Keystore (One-Time)

on:
  workflow_dispatch:
    inputs:
      organization_name:
        description: 'School or Organisation name for certificate DN (optional)'
        required: false
        default: 'School Report Card'
        type: string

permissions:
  contents: read

jobs:
  create-upload-keystore:
    name: Generate Play Store Upload Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate upload keystore and fingerprints
        id: gen_keystore
        shell: bash
        env:
          ORG_INPUT: ${{ inputs.organization_name }}
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [[ ! -x "${KEYTOOL_BIN}" ]]; then
            echo "::error::keytool not found at ${KEYTOOL_BIN}."
            exit 1
          fi

          # Sanitize DN field to safe printable characters without commas/slashes
          ORG_CLEAN="$(printf '%s' "${ORG_INPUT:-School Report Card}" | tr -cd 'A-Za-z0-9 .-_' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [[ -z "${ORG_CLEAN}" ]]; then
            ORG_CLEAN="School Report Card"
          fi

          OUT_DIR="${RUNNER_TEMP}/upload-keystore-out"
          mkdir -p "${OUT_DIR}"
          KEYSTORE_FILE="${OUT_DIR}/my-upload-key.jks"
          INFO_FILE="${OUT_DIR}/PASSWORDS_AND_BASE64.txt"

          # Generate strong random passwords strictly inside runner temp file (never printed to stdout/summary)
          STORE_PASS="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)"
          KEY_PASS="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)"

          if [[ ${#STORE_PASS} -lt 16 || ${#KEY_PASS} -lt 16 ]]; then
            echo "::error::Failed to generate strong random passwords."
            exit 1
          fi

          "${KEYTOOL_BIN}" -genkeypair -noprompt \
            -keystore "${KEYSTORE_FILE}" \
            -storepass "${STORE_PASS}" \
            -alias upload \
            -keypass "${KEY_PASS}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9125 \
            -dname "CN=${ORG_CLEAN}, OU=Play Upload Key, O=${ORG_CLEAN}, C=IN"

          KEYTOOL_LIST="$("${KEYTOOL_BIN}" -list -v -keystore "${KEYSTORE_FILE}" -storepass "${STORE_PASS}" -alias upload)"
          SHA1_VALUE="$(printf '%s\n' "${KEYTOOL_LIST}" | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1)"
          SHA256_VALUE="$(printf '%s\n' "${KEYTOOL_LIST}" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)"

          if [[ -z "${SHA1_VALUE}" || -z "${SHA256_VALUE}" ]]; then
            echo "::error::Failed to read SHA-1 / SHA-256 from newly generated keystore."
            exit 1
          fi

          KEYSTORE_B64="$(base64 -w 0 "${KEYSTORE_FILE}")"

          {
            echo "================================================================"
            echo "SCHOOL REPORT CARD - PLAY STORE UPLOAD KEYSTORE SECRETS"
            echo "SAVE THIS FILE + my-upload-key.jks IN TWO SECURE PLACES!"
            echo "NEVER COMMIT THESE FILES TO GITHUB."
            echo "================================================================"
            echo ""
            echo "Alias: upload"
            echo "Validity: 9125 days (~25 years)"
            echo "SHA-1:   ${SHA1_VALUE}"
            echo "SHA-256: ${SHA256_VALUE}"
            echo ""
            echo "GitHub Repository Secrets (Settings -> Secrets and variables -> Actions):"
            echo "----------------------------------------------------------------"
            echo "STORE_PASSWORD=${STORE_PASS}"
            echo "KEY_PASSWORD=${KEY_PASS}"
            echo "UPLOAD_KEYSTORE_BASE64=${KEYSTORE_B64}"
          } > "${INFO_FILE}"

          chmod 600 "${KEYSTORE_FILE}" "${INFO_FILE}"

          echo "Upload keystore generated successfully inside private artifact directory."
          echo "SHA-1:   ${SHA1_VALUE}"
          echo "SHA-256: ${SHA256_VALUE}"

          {
            echo "## Upload Keystore Created Successfully"
            echo ""
            echo "> **Action Required (Immediate):** Download the private artifact \`upload-keystore-private-1day\` below right now. It expires automatically after **1 day**. Save \`my-upload-key.jks\` and \`PASSWORDS_AND_BASE64.txt\` in two safe offline places."
            echo ""
            echo "### Copy These Fingerprints to Firebase Console"
            echo "- **Key Alias:** \`upload\`"
            echo "- **SHA-1:** \`${SHA1_VALUE}\`"
            echo "- **SHA-256:** \`${SHA256_VALUE}\`"
            echo ""
            echo "### Next Steps on Your Phone"
            echo "1. Open the downloaded \`PASSWORDS_AND_BASE64.txt\`."
            echo "2. In GitHub **Settings -> Secrets and variables -> Actions**, add:"
            echo "   - \`UPLOAD_KEYSTORE_BASE64\`"
            echo "   - \`STORE_PASSWORD\`"
            echo "   - \`KEY_PASSWORD\`"
            echo "   - \`GOOGLE_SERVICES_JSON\` (latest file from Firebase Console after adding SHA-1 & SHA-256)"
            echo "3. Run **Build Signed Release AAB** from the **Actions** tab."
            echo ""
            echo "**Passwords and Base64 are NOT shown in logs or this summary for security.**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload private keystore artifact (1-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-private-1day
          path: ${{ runner.temp }}/upload-keystore-out
          retention-days: 1
          if-no-files-found: error

      - name: Wipe temporary keystore directory from runner
        if: always()
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/upload-keystore-out" || true

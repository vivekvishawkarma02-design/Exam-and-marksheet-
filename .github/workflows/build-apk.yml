name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [[ -z "${JAVA_HOME:-}" ]]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VERSION_OUTPUT="$(java -version 2>&1)"
          echo "${JAVA_VERSION_OUTPUT}"

          RAW_VERSION="$(printf '%s\n' "${JAVA_VERSION_OUTPUT}" | sed -n 's/.*version "\([^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "${RAW_VERSION}" ]]; then
            echo "::error::Unable to detect the active Java version."
            exit 1
          fi

          if [[ "${RAW_VERSION}" == 1.* ]]; then
            MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | cut -d. -f2)"
          else
            MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | cut -d. -f1 | sed 's/[^0-9].*$//')"
          fi

          if [[ -z "${MAJOR_VERSION}" || ! "${MAJOR_VERSION}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse the active Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if (( MAJOR_VERSION < 17 )); then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"

          if [[ ! -x "${KEYTOOL_BIN}" ]]; then
            echo "::error::keytool not found at ${KEYTOOL_BIN}."
            exit 1
          fi

          if [[ -f "${KEYSTORE_PATH}" ]]; then
            echo "Debug keystore already exists at ${KEYSTORE_PATH}; skipping generation."
          else
            "${KEYTOOL_BIN}" -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              >/dev/null 2>&1
          fi

          if [[ ! -f "${KEYSTORE_PATH}" || ! -s "${KEYSTORE_PATH}" ]]; then
            echo "::error::Failed to create temporary debug keystore at ${KEYSTORE_PATH}."
            exit 1
          fi

          echo "Verified temporary debug keystore exists."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -e "${EXPECTED_APK}" ]]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [[ -d "app/build/outputs/apk" ]]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [[ ! -f "${EXPECTED_APK}" ]]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi

          if [[ ! -s "${EXPECTED_APK}" ]]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "${EXPECTED_APK}" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi

          APK_SIZE="$(wc -c < "${EXPECTED_APK}")"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "${SOURCE_APK}" || ! -s "${SOURCE_APK}" || "${SOURCE_APK}" != *.apk ]]; then
            echo "::error::Verified debug APK is missing or invalid at ${SOURCE_APK}."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO="$(printf '%s' "${RAW_REPO_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')"

          if [[ -z "${SANITIZED_REPO}" ]]; then
            SANITIZED_REPO="android-app"
          fi

          ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/debug-apk-release-XXXXXX")"
          ASSET_NAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp -- "${SOURCE_APK}" "${ASSET_PATH}"

          if [[ ! -f "${ASSET_PATH}" || ! -s "${ASSET_PATH}" || "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Failed to prepare release APK asset at ${ASSET_PATH}."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi

          gh --version

          if [[ -z "${ASSET_PATH}" || ! -f "${ASSET_PATH}" || ! -s "${ASSET_PATH}" || "${ASSET_PATH}" != *.apk ]]; then
            echo "::warning::Prepared APK release asset is missing or invalid; skipping GitHub Release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES="$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **APK File:** \`${ASSET_NAME}\`

          ### Important Notice
          - This APK is intended for testing only.
          - This APK is not a Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF
          )"

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --target "${GITHUB_SHA}" \
            --notes "${RELEASE_NOTES}" \
            --latest

      - name: Report APK download result
        if: ${{ always() && steps.upload_artifact.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          if [[ "${PUBLISH_OUTCOME}" == "success" && -n "${RELEASE_TAG}" ]]; then
            if RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url' 2>/dev/null)" && [[ -n "${RELEASE_URL}" ]]; then
              echo "GitHub Release published successfully."
              echo "Release Tag: ${RELEASE_TAG}"
              echo "Release Title: ${RELEASE_TITLE}"
              echo "Release URL: ${RELEASE_URL}"
              echo "APK Asset Filename: ${ASSET_NAME}"

              {
                echo "## Debug APK Build & Release Summary"
                echo ""
                echo "- **Status:** APK built, artifact uploaded, and GitHub Release published"
                echo "- **Release Tag:** \`${RELEASE_TAG}\`"
                echo "- **Release Title:** ${RELEASE_TITLE}"
                echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
                echo "- **GitHub Release Page:** ${RELEASE_URL}"
                echo ""
                echo "Download the APK directly from the **Assets** section on the GitHub Release page above."
                echo ""
                echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run as a backup."
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi

          echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
          echo "APK build succeeded."
          echo "Backup Actions artifact available: app-debug-apk"

          {
            echo "## Debug APK Build & Release Summary"
            echo ""
            echo "> **Warning:** Publishing the APK to GitHub Releases failed. No release URL is available."
            echo ""
            echo "- **APK Build:** Succeeded"
            echo "- **Actions Artifact Backup:** \`app-debug-apk\` remains available for download from this workflow run's **Artifacts** section."
          } >> "${GITHUB_STEP_SUMMARY}"

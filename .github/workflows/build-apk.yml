name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [[ -z "${JAVA_HOME:-}" ]]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VERSION_OUTPUT="$(java -version 2>&1)"
          echo "${JAVA_VERSION_OUTPUT}"

          RAW_VERSION="$(printf '%s\n' "${JAVA_VERSION_OUTPUT}" | sed -n 's/.*version "\([^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "${RAW_VERSION}" ]]; then
            echo "::error::Unable to detect the active Java version."
            exit 1
          fi

          if [[ "${RAW_VERSION}" == 1.* ]]; then
            MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | cut -d. -f2)"
          else
            MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | cut -d. -f1 | sed 's/[^0-9].*$//')"
          fi

          if [[ -z "${MAJOR_VERSION}" || ! "${MAJOR_VERSION}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse the active Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if (( MAJOR_VERSION < 17 )); then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare debug keystore
        id: debug_keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          BASE64_PATH="./debug.keystore.base64"
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"

          if [[ ! -x "${KEYTOOL_BIN}" ]]; then
            echo "::error::keytool not found at ${KEYTOOL_BIN}."
            exit 1
          fi

          if [[ -f "${KEYSTORE_PATH}" && -s "${KEYSTORE_PATH}" ]]; then
            KEYSTORE_SOURCE="committed debug.keystore"
            echo "Using existing fixed debug keystore at ${KEYSTORE_PATH}; skipping generation."
          elif [[ -f "${BASE64_PATH}" && -s "${BASE64_PATH}" ]]; then
            KEYSTORE_SOURCE="committed debug.keystore.base64"
            echo "Decoding fixed debug keystore from ${BASE64_PATH} to ${KEYSTORE_PATH}; skipping generation."
            tr -d '\r\n' < "${BASE64_PATH}" | base64 -d > "${KEYSTORE_PATH}"
          else
            KEYSTORE_SOURCE="fallback temporary debug keystore"
            echo "::warning::Neither ${KEYSTORE_PATH} nor ${BASE64_PATH} found; generating fallback temporary debug keystore."
            "${KEYTOOL_BIN}" -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950 \
              >/dev/null 2>&1
          fi

          if [[ ! -f "${KEYSTORE_PATH}" || ! -s "${KEYSTORE_PATH}" ]]; then
            echo "::error::Failed to prepare debug keystore at ${KEYSTORE_PATH}."
            exit 1
          fi

          echo "keystore_source=${KEYSTORE_SOURCE}" >> "${GITHUB_OUTPUT}"
          echo "Verified debug keystore exists (source: ${KEYSTORE_SOURCE})."

      - name: Ensure Android SDK 36.1 and build-tools are installed
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -n "${SDKMANAGER}" && -x "${SDKMANAGER}" ]]; then
            yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1 || true
            if [[ ! -d "${SDK_ROOT}/platforms/android-36.1" || ! -d "${SDK_ROOT}/build-tools/36.0.0" ]]; then
              "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" "platforms;android-36.1" "build-tools;36.0.0"
            else
              echo "Android SDK platform android-36.1 and build-tools 36.0.0 already present."
            fi
          else
            echo "::warning::sdkmanager not found under ${SDK_ROOT}; relying on pre-installed Android SDK."
          fi

      - name: Write google-services.json from secret
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "${GOOGLE_SERVICES_JSON_SECRET:-}" ]]; then
            mkdir -p app
            printf '%s\n' "${GOOGLE_SERVICES_JSON_SECRET}" > app/google-services.json
            echo "Wrote app/google-services.json from GOOGLE_SERVICES_JSON secret."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret is empty; building APK without app/google-services.json (app will display the Firebase not configured notice)."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          set +e
          gradle :app:assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee build.log
          BUILD_EXIT_CODE=$?
          set -e

          if [[ "${BUILD_EXIT_CODE}" -ne 0 ]]; then
            python3 - <<'PY'
          import os, re

          def gh_escape(s: str) -> str:
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          with open("build.log", "r", encoding="utf-8", errors="replace") as f:
              lines = [line.rstrip("\r\n") for line in f]

          e_lines = [line for line in lines if line.startswith("e: ")]

          what_went_wrong = []
          in_www = False
          for line in lines:
              if line.startswith("* What went wrong:"):
                  in_www = True
                  what_went_wrong.append(line)
                  continue
              if in_www:
                  if line.startswith("* Try:") or line.startswith("* Exception is:") or line.startswith("BUILD FAILED"):
                      break
                  what_went_wrong.append(line)
          while what_went_wrong and not what_went_wrong[-1].strip():
              what_went_wrong.pop()

          max_annotations = 10
          emitted = 0

          if what_went_wrong and e_lines:
              e_cap = max_annotations - 1
              for line in e_lines[:e_cap]:
                  print(f"::error::{gh_escape(line)}")
                  emitted += 1
              print(f"::error::{gh_escape(chr(10).join(what_went_wrong))}")
              emitted += 1
          elif e_lines:
              for line in e_lines[:max_annotations]:
                  print(f"::error::{gh_escape(line)}")
                  emitted += 1
          elif what_went_wrong:
              print(f"::error::{gh_escape(chr(10).join(what_went_wrong))}")
              emitted += 1
          else:
              fallback = [l for l in lines if re.search(r"(FAILURE:|Execution failed|Caused by:)", l)]
              for line in fallback[:max_annotations]:
                  print(f"::error::{gh_escape(line)}")
                  emitted += 1

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write("## Gradle Build Failure Details\n\n")
                  if what_went_wrong:
                      sf.write("```text\n" + "\n".join(what_went_wrong) + "\n```\n\n")
                  if e_lines:
                      sf.write("### First Compiler Errors\n```text\n" + "\n".join(e_lines[:10]) + "\n```\n")
          PY
            exit "${BUILD_EXIT_CODE}"
          fi

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -e "${EXPECTED_APK}" ]]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [[ -d "app/build/outputs/apk" ]]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [[ ! -f "${EXPECTED_APK}" ]]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi

          if [[ ! -s "${EXPECTED_APK}" ]]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "${EXPECTED_APK}" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi

          APK_SIZE="$(wc -c < "${EXPECTED_APK}")"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_SIZE} bytes)"

      - name: Print debug keystore SHA-1 and SHA-256
        id: keystore_fingerprints
        shell: bash
        env:
          KEYSTORE_SOURCE: ${{ steps.debug_keystore.outputs.keystore_source }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"

          if [[ ! -f "${KEYSTORE_PATH}" || ! -s "${KEYSTORE_PATH}" ]]; then
            echo "::error::Debug keystore not found at ${KEYSTORE_PATH}."
            exit 1
          fi

          KEYTOOL_OUT="$("${KEYTOOL_BIN}" -list -v -keystore "${KEYSTORE_PATH}" -storepass android -alias androiddebugkey)"
          echo "=== Debug Keystore Fingerprints (source: ${KEYSTORE_SOURCE}) ==="
          printf '%s\n' "${KEYTOOL_OUT}"

          SHA1_VALUE="$(printf '%s\n' "${KEYTOOL_OUT}" | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1)"
          SHA256_VALUE="$(printf '%s\n' "${KEYTOOL_OUT}" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)"

          if [[ -z "${SHA1_VALUE}" || -z "${SHA256_VALUE}" ]]; then
            echo "::error::Failed to parse SHA-1 or SHA-256 from keytool output."
            exit 1
          fi

          echo "DEBUG_KEYSTORE_SHA1=${SHA1_VALUE}"
          echo "DEBUG_KEYSTORE_SHA256=${SHA256_VALUE}"
          echo "sha1=${SHA1_VALUE}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SHA256_VALUE}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Debug Keystore Fingerprints (Google Sign-In / Firebase)"
            echo ""
            echo "- **Keystore Source:** \`${KEYSTORE_SOURCE}\`"
            echo "- **Alias:** \`androiddebugkey\`"
            echo "- **SHA-1:** \`${SHA1_VALUE}\`"
            echo "- **SHA-256:** \`${SHA256_VALUE}\`"
            echo ""
            echo "<details>"
            echo "<summary>Full <code>keytool -list -v</code> output</summary>"
            echo ""
            echo '```text'
            printf '%s\n' "${KEYTOOL_OUT}"
            echo '```'
            echo "</details>"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "${SOURCE_APK}" || ! -s "${SOURCE_APK}" || "${SOURCE_APK}" != *.apk ]]; then
            echo "::error::Verified debug APK is missing or invalid at ${SOURCE_APK}."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO="$(printf '%s' "${RAW_REPO_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')"

          if [[ -z "${SANITIZED_REPO}" ]]; then
            SANITIZED_REPO="android-app"
          fi

          ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/debug-apk-release-XXXXXX")"
          ASSET_NAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp -- "${SOURCE_APK}" "${ASSET_PATH}"

          if [[ ! -f "${ASSET_PATH}" || ! -s "${ASSET_PATH}" || "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Failed to prepare release APK asset at ${ASSET_PATH}."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
          KEYSTORE_SOURCE: ${{ steps.debug_keystore.outputs.keystore_source }}
          DEBUG_SHA1: ${{ steps.keystore_fingerprints.outputs.sha1 }}
          DEBUG_SHA256: ${{ steps.keystore_fingerprints.outputs.sha256 }}
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi

          gh --version

          if [[ -z "${ASSET_PATH}" || ! -f "${ASSET_PATH}" || ! -s "${ASSET_PATH}" || "${ASSET_PATH}" != *.apk ]]; then
            echo "::warning::Prepared APK release asset is missing or invalid; skipping GitHub Release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES="$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **APK File:** \`${ASSET_NAME}\`
          - **Debug Keystore Source:** \`${KEYSTORE_SOURCE}\`
          - **SHA-1:** \`${DEBUG_SHA1}\`
          - **SHA-256:** \`${DEBUG_SHA256}\`

          ### Important Notice
          - This APK is intended for testing only.
          - This APK is not a Play Store production release.
          - This APK is signed with the debug keystore only (release builds use the separate release signingConfig).
          EOF
          )"

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --target "${GITHUB_SHA}" \
            --notes "${RELEASE_NOTES}" \
            --latest

      - name: Report APK download result
        if: ${{ always() && steps.upload_artifact.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          if [[ "${PUBLISH_OUTCOME}" == "success" && -n "${RELEASE_TAG}" ]]; then
            if RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url' 2>/dev/null)" && [[ -n "${RELEASE_URL}" ]]; then
              echo "GitHub Release published successfully."
              echo "Release Tag: ${RELEASE_TAG}"
              echo "Release Title: ${RELEASE_TITLE}"
              echo "Release URL: ${RELEASE_URL}"
              echo "APK Asset Filename: ${ASSET_NAME}"

              {
                echo "## Debug APK Build & Release Summary"
                echo ""
                echo "- **Status:** APK built, artifact uploaded, and GitHub Release published"
                echo "- **Release Tag:** \`${RELEASE_TAG}\`"
                echo "- **Release Title:** ${RELEASE_TITLE}"
                echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
                echo "- **GitHub Release Page:** ${RELEASE_URL}"
                echo ""
                echo "Download the APK directly from the **Assets** section on the GitHub Release page above."
                echo ""
                echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run as a backup."
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi

          echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
          echo "APK build succeeded."
          echo "Backup Actions artifact available: app-debug-apk"

          {
            echo "## Debug APK Build & Release Summary"
            echo ""
            echo "> **Warning:** Publishing the APK to GitHub Releases failed. No release URL is available."
            echo ""
            echo "- **APK Build:** Succeeded"
            echo "- **Actions Artifact Backup:** \`app-debug-apk\` remains available for download from this workflow run's **Artifacts** section."
          } >> "${GITHUB_STEP_SUMMARY}"

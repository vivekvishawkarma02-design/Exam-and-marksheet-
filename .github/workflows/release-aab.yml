name: Build Signed Release AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Optional override for APP_VERSION_CODE (integer, leave blank to use gradle.properties)'
        required: false
        default: ''
        type: string
      version_name:
        description: 'Optional override for APP_VERSION_NAME (e.g. 1.0.1, leave blank to use gradle.properties)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-signed-release-aab:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required release secrets
        shell: bash
        env:
          HAS_KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
          HAS_SP: ${{ secrets.STORE_PASSWORD != '' }}
          HAS_KP: ${{ secrets.KEY_PASSWORD != '' }}
          HAS_GS: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: |
          set -euo pipefail
          MISSING=()
          [[ "${HAS_KS}" == "true" ]] || MISSING+=("UPLOAD_KEYSTORE_BASE64")
          [[ "${HAS_SP}" == "true" ]] || MISSING+=("STORE_PASSWORD")
          [[ "${HAS_KP}" == "true" ]] || MISSING+=("KEY_PASSWORD")
          [[ "${HAS_GS}" == "true" ]] || MISSING+=("GOOGLE_SERVICES_JSON")

          if (( ${#MISSING[@]} > 0 )); then
            echo "::error::Missing required GitHub Actions secrets: ${MISSING[*]}. Run 'Create Upload Keystore (One-Time)' first and add all 4 secrets under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required release secrets are configured."

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Ensure Android SDK 36.1 and build-tools are installed
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -n "${SDKMANAGER}" && -x "${SDKMANAGER}" ]]; then
            yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1 || true
            if [[ ! -d "${SDK_ROOT}/platforms/android-36.1" || ! -d "${SDK_ROOT}/build-tools/36.0.0" ]]; then
              "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" "platforms;android-36.1" "build-tools;36.0.0"
            else
              echo "Android SDK platform android-36.1 and build-tools 36.0.0 already present."
            fi
          fi

      - name: Prepare upload keystore, google-services.json, and .env
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64_VAL: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD_VAL: ${{ secrets.STORE_PASSWORD }}
          GOOGLE_SERVICES_JSON_VAL: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          KS_PATH="${RUNNER_TEMP}/my-upload-key.jks"
          printf '%s' "${UPLOAD_KEYSTORE_BASE64_VAL}" | tr -d '\r\n ' | base64 -d > "${KS_PATH}"
          chmod 600 "${KS_PATH}"

          if [[ ! -s "${KS_PATH}" ]]; then
            echo "::error::Decoded upload keystore is empty."
            exit 1
          fi

          mkdir -p app
          printf '%s\n' "${GOOGLE_SERVICES_JSON_VAL}" > app/google-services.json

          if [[ ! -f ".env" && -f ".env.example" ]]; then
            cp .env.example .env
          fi

          KEYTOOL_OUT="$("${JAVA_HOME}/bin/keytool" -list -v -keystore "${KS_PATH}" -storepass:env STORE_PASSWORD_VAL -alias upload)"
          SHA1_VALUE="$(printf '%s\n' "${KEYTOOL_OUT}" | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1)"
          SHA256_VALUE="$(printf '%s\n' "${KEYTOOL_OUT}" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)"

          {
            echo "## Signed Release AAB Certificate Details"
            echo ""
            echo "- **Upload Key Alias:** \`upload\`"
            echo "- **Upload SHA-1:** \`${SHA1_VALUE}\`"
            echo "- **Upload SHA-256:** \`${SHA256_VALUE}\`"
            echo ""
            echo "> **Important for Google Sign-In on Play Store:** After uploading this \`.aab\` to Play Console, copy Google Play's **App signing key certificate SHA-1 & SHA-256** (Play Console -> Test and release -> Setup -> App signing) into **Firebase Console -> Project Settings -> Android App**!"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build Signed Release AAB
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [[ -n "${INPUT_VERSION_CODE}" ]]; then
            if [[ ! "${INPUT_VERSION_CODE}" =~ ^[0-9]+$ ]]; then
              echo "::error::version_code must be a positive integer."
              exit 1
            fi
            EXTRA_ARGS+=("-PAPP_VERSION_CODE=${INPUT_VERSION_CODE}")
          fi
          if [[ -n "${INPUT_VERSION_NAME}" ]]; then
            EXTRA_ARGS+=("-PAPP_VERSION_NAME=${INPUT_VERSION_NAME}")
          fi

          gradle :app:bundleRelease "${EXTRA_ARGS[@]}" --stacktrace --no-daemon --console=plain

      - name: Verify release AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [[ ! -s "${AAB_PATH}" ]]; then
            echo "::error::Expected release AAB not found or empty at ${AAB_PATH}."
            exit 1
          fi
          AAB_SIZE="$(wc -c < "${AAB_PATH}")"
          echo "Verified release AAB: ${AAB_PATH} (${AAB_SIZE} bytes)"
          {
            echo ""
            echo "### Release AAB Artifact Ready"
            echo "- **Path:** \`${AAB_PATH}\`"
            echo "- **Size:** ${AAB_SIZE} bytes"
            echo "- Download \`school-report-card-release-aab\` below and upload manually to Google Play Console."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-report-card-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload R8 ProGuard mapping artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-proguard-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Cleanup sensitive decoded files
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/my-upload-key.jks" app/google-services.json || true
